events { worker_connections 1024;
}

http {
    # Rate limit zones (stored in Redis-like shared memory)
    limit_req_zone $binary_remote_addr zone=match_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=event_limit:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=guest_limit:10m  rate=200r/m;
    limit_req_zone $binary_remote_addr zone=admin_limit:10m  rate=30r/m;
    limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=60r/m;

    upstream photographer_service {
        # server photographer-service:8001;
        server host.docker.internal:8001;
    }

    upstream guest_service {
        # server guest-service:8002;
        server host.docker.internal:8002;
    }

    # subscription-service is dockerized (see docker-compose-infra.yml) and
    # joins the same compose network as this gateway, so its Docker Compose
    # service name resolves directly — unlike photographer/guest above,
    # which still run natively via uvicorn during local dev.
    upstream subscription_service {
        # server host.docker.internal:8003;  # only if running subscription-service natively instead
        server subscription-service:8003;
    }

    server {
        listen 8000;

        # ── Photographer routes (JWT required — enforced inside service) ──
        location /auth/ {
            limit_req zone=event_limit burst=20 nodelay;
            proxy_pass http://photographer_service/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        location /events/ {
            limit_req zone=event_limit burst=20 nodelay;
            proxy_pass http://photographer_service/events/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # ── Guest routes (public) ──
        location /guest/ {
            limit_req zone=guest_limit burst=50 nodelay;
            proxy_pass http://guest_service/guest/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            client_max_body_size 20M;
            proxy_redirect off;
        }

        location /match/ {
            limit_req zone=match_limit burst=2 nodelay;
            proxy_pass http://guest_service/match/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            client_max_body_size 20M;
            proxy_redirect off;
        }

        # ── Subscription-service routes ──
        # CORS is intentionally NOT handled here: subscription-service already
        # applies its own FastAPI CORSMiddleware (restricted to the known
        # frontend origins, not a wildcard) and nginx passes those response
        # headers through untouched — same as every other route in this file.
        # Duplicating CORS logic at the gateway would risk the two disagreeing.

        # Public catalog — no auth required.
        location /api/v1/packages {
            limit_req zone=event_limit burst=20 nodelay;
            proxy_pass http://subscription_service/api/v1/packages;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # JWT required — enforced inside the service, not here.
        location /api/v1/subscriptions {
            limit_req zone=event_limit burst=20 nodelay;
            proxy_pass http://subscription_service/api/v1/subscriptions;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # Admin-flagged JWT required — enforced inside the service. Lower,
        # stricter rate limit since these are privileged management endpoints.
        location /api/v1/admin {
            limit_req zone=admin_limit burst=10 nodelay;
            proxy_pass http://subscription_service/api/v1/admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # Public — called by the (dummy) payment gateway itself, not a
        # logged-in user, so there's no JWT to forward here.
        location /api/v1/webhooks {
            limit_req zone=webhook_limit burst=10 nodelay;
            proxy_pass http://subscription_service/api/v1/webhooks;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # ── Health ──
        location /health {
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # Rate limit error response
        error_page 503 = @rate_limited;
        location @rate_limited {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header Content-Type application/json;
            add_header Retry-After 60;
            return 429 '{"detail":"Too many requests. Slow down."}';
        }
    }
}